<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title>CainiaoTracker - Privacy Policy</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f5f5f5;
            color: #333;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.7;
        }

        main {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        h1, h2, h3 {
            color: #222;
            line-height: 1.3;
        }

        h1 {
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        a {
            color: #0969da;
        }

        #content {
            overflow-wrap: break-word;
        }

        #status {
            text-align: center;
            color: #777;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            main {
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body>
<main>
    <div id="status">Loading privacy policy...</div>
    <article id="content"></article>
</main>

<script>
    const markdownUrl = './ReadMe.md';

    async function loadPrivacyPolicy() {
        const status = document.getElementById('status');
        const content = document.getElementById('content');

        try {
            const response = await fetch(markdownUrl);

            if (!response.ok) {
                throw new Error('Unable to load ReadMe.md');
            }

            const markdown = await response.text();

            content.innerHTML = marked.parse(markdown);
            status.style.display = 'none';

            document.title = 'CainiaoTracker - Privacy Policy';

        } catch (error) {
            status.textContent =
                'Unable to load the privacy policy. Please try again later.';

            console.error(error);
        }
    }

    loadPrivacyPolicy();
</script>
</body>
</html>
